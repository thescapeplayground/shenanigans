<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="100%" height="100%" fill="none">
  <rect width="800" height="340" rx="16" fill="#09090b" stroke="#27272a" stroke-width="1.5"/>
  <text x="36" y="44" fill="#fafafa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" letter-spacing="-0.02em">SnapWeb: Client-Side Processing Architecture</text>
  <text x="36" y="66" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Zero-server, local-first image manipulation pipeline via HTML5 Canvas &amp; WebGL</text>

  <!-- Step 1: Input Buffer -->
  <g transform="translate(36, 95)">
    <rect width="210" height="110" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1.2"/>
    <circle cx="20" cy="22" r="6" fill="#38bdf8"/>
    <text x="34" y="26" fill="#fafafa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">1. Image Decoder</text>
    <text x="16" y="52" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">FileReader API &amp; ImageData</text>
    <text x="16" y="70" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Downscaled preview proxy</text>
    <text x="16" y="90" fill="#38bdf8" font-family="monospace" font-size="10">OffscreenCanvas / RGBA</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 256 150 L 285 150" stroke="#52525b" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="285,146 293,150 285,154" fill="#52525b"/>

  <!-- Step 2: Tone & Curve Shaders -->
  <g transform="translate(295, 95)">
    <rect width="210" height="110" rx="10" fill="#18181b" stroke="#9333ea" stroke-width="1.5"/>
    <circle cx="20" cy="22" r="6" fill="#c084fc"/>
    <text x="34" y="26" fill="#fafafa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">2. Adjustment Engine</text>
    <text x="16" y="52" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Brightness, Contrast, Ambiance</text>
    <text x="16" y="70" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Shadows / Highlights mapping</text>
    <text x="16" y="90" fill="#c084fc" font-family="monospace" font-size="10">WebGL Fragment Shaders</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 515 150 L 544 150" stroke="#52525b" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="544,146 552,150 544,154" fill="#52525b"/>

  <!-- Step 3: Interactive Render & Histogram -->
  <g transform="translate(554, 95)">
    <rect width="210" height="110" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1.2"/>
    <circle cx="20" cy="22" r="6" fill="#4ade80"/>
    <text x="34" y="26" fill="#fafafa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">3. Live Render &amp; HUD</text>
    <text x="16" y="52" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Gesture touch/mouse control</text>
    <text x="16" y="70" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Real-time 256-bin RGB curve</text>
    <text x="16" y="90" fill="#4ade80" font-family="monospace" font-size="10">60 FPS 2D Context</text>
  </g>

  <!-- Bottom Details Bar -->
  <g transform="translate(36, 225)">
    <rect width="728" height="85" rx="10" fill="#18181b" stroke="#27272a"/>
    <text x="20" y="28" fill="#fafafa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Key Benefits of Local Processing:</text>
    <text x="20" y="50" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">• <tspan fill="#38bdf8" font-weight="600">100% Privacy</tspan>: RAW &amp; high-resolution photos never leave your device.</text>
    <text x="20" y="68" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">• <tspan fill="#c084fc" font-weight="600">Instant Latency</tspan>: Interactive parameter dragging rendered at fluid 60 FPS without network round-trips.</text>
  </g>
</svg>
