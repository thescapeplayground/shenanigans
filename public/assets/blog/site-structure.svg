    <rect x="14" y="14" width="8" height="8" rx="4" fill="#ec4899"/>
    <text x="30" y="22" fill="#fafafa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">Services &amp; Experiments Hub</text>
    <text x="14" y="48" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Modular service categories, FAQ accordions &amp; pricing</text>
    <text x="14" y="66" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Curated Android APKs, web utilities, &amp; community bots</text>
    <text x="14" y="86" fill="#ec4899" font-family="monospace" font-size="10">components/ServicesSection.tsx</text>
