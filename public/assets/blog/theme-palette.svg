<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%" fill="none">
  <rect width="800" height="320" rx="16" fill="#09090b" stroke="#27272a" stroke-width="1.5"/>
  <text x="36" y="48" fill="#fafafa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" letter-spacing="-0.02em">Theme &amp; Color Architecture</text>
  <text x="36" y="70" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Monochrome foundation with electric violet accents and dynamic glass surfaces</text>

  <!-- Color Swatches -->
  <g transform="translate(36, 95)">
    <!-- Obsidian Dark -->
    <rect x="0" y="0" width="130" height="120" rx="12" fill="#09090b" stroke="#27272a" stroke-width="1.5"/>
    <circle cx="24" cy="24" r="10" fill="#09090b" stroke="#3f3f46"/>
    <text x="20" y="78" fill="#fafafa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">Obsidian</text>
    <text x="20" y="96" fill="#71717a" font-family="monospace" font-size="11">#09090b</text>
    <text x="20" y="110" fill="#52525b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">Base Dark</text>

    <!-- Zinc Surface -->
    <rect x="148" y="0" width="130" height="120" rx="12" fill="#18181b" stroke="#27272a" stroke-width="1.5"/>
    <circle cx="172" cy="24" r="10" fill="#18181b" stroke="#3f3f46"/>
    <text x="168" y="78" fill="#fafafa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">Zinc Surface</text>
    <text x="168" y="96" fill="#71717a" font-family="monospace" font-size="11">#18181b</text>
    <text x="168" y="110" fill="#52525b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">Card Elev 1</text>

    <!-- Border Neutral -->
    <rect x="296" y="0" width="130" height="120" rx="12" fill="#27272a" stroke="#3f3f46" stroke-width="1.5"/>
    <circle cx="320" cy="24" r="10" fill="#27272a" stroke="#52525b"/>
    <text x="316" y="78" fill="#fafafa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">Border Subtle</text>
    <text x="316" y="96" fill="#a1a1aa" font-family="monospace" font-size="11">#27272a</text>
    <text x="316" y="110" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">Delimiters</text>

    <!-- Accent Violet -->
    <rect x="444" y="0" width="130" height="120" rx="12" fill="#9333ea" stroke="#a855f7" stroke-width="1.5"/>
    <circle cx="468" cy="24" r="10" fill="#c084fc"/>
    <text x="464" y="78" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">Violet Core</text>
    <text x="464" y="96" fill="#e9d5ff" font-family="monospace" font-size="11">#9333ea</text>
    <text x="464" y="110" fill="#f3e8ff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">Primary Focus</text>

    <!-- Light Canvas -->
    <rect x="592" y="0" width="130" height="120" rx="12" fill="#fafafa" stroke="#e4e4e7" stroke-width="1.5"/>
    <circle cx="616" cy="24" r="10" fill="#ffffff" stroke="#d4d4d8"/>
    <text x="612" y="78" fill="#09090b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">Paper White</text>
    <text x="612" y="96" fill="#71717a" font-family="monospace" font-size="11">#fafafa</text>
    <text x="612" y="110" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">Light Base</text>
  </g>

  <!-- Typography & Features Bar -->
  <g transform="translate(36, 240)">
    <rect width="728" height="52" rx="8" fill="#18181b" stroke="#27272a"/>
    <text x="20" y="31" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Typography: <tspan fill="#fafafa" font-weight="600">Inter / Geist Sans</tspan> &amp; <tspan fill="#fafafa" font-weight="600">JetBrains Mono</tspan></text>
    <text x="430" y="31" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Contrast Ratio: <tspan fill="#4ade80" font-weight="600">14.8:1 (AAA WCAG)</tspan></text>
  </g>
</svg>
